<body class="assistant-page">
  <header class="assistant-header">
    <a class="assistant-brand" href="./index.html" aria-label="楼宇智派，返回工作台">
      <span class="assistant-mark" aria-hidden="true">▦</span>
      <span>楼宇智派 <small>智能助手</small></span>

    <nav class="assistant-actions" aria-label="智能助手操作">
      <a class="assistant-button" href="./index.html">返回工作台</a>
      <button id="agent-refresh" class="assistant-button" type="button">重新加载</button>
      <!-- 更新智能体地址时，只需替换下面的 href。 -->
      <a id="agent-open" class="assistant-button primary" href="https://code.coze.cn/web-sdk/7701582112343998483" target="_blank" rel="noopener noreferrer">新窗口打开 ↗</a>

  </header>
  <main class="assistant-main">

      <div class="eyebrow">AI ASSISTANT</div>
      <h1 id="assistant-title">校园网运维智能助手</h1>

    <section class="assistant-panel" aria-label="智能体对话">
      <div id="agent-frame-area" class="assistant-frame-area" aria-busy="true">
        <div id="agent-loading" class="assistant-loading" aria-hidden="true">
          <span class="assistant-spinner"></span>
          <span>正在打开智能助手…</span>
        </div>
      </div>
      <p id="agent-status" class="assistant-status" role="status" aria-live="polite">正在打开对话页面…</p>

    <noscript><p>请使用上方“新窗口打开”进入智能助手。</p></noscript>
